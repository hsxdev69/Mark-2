name: Build MovieVortex APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build MovieVortex APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build MovieVortex APK
        run: |
          ./gradlew assembleStableRelease --stacktrace --no-daemon

      - name: Locate Generated APK
        id: locate_apk
        run: |
          echo "Finding generated APKs..."
          find app/build/outputs/apk/ -name "*.apk" -ls

      - name: Upload MovieVortex APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieVortex-APK
          path: app/build/outputs/apk/stable/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0-latest
          name: "MovieVortex 2.0 (Pure B&W + CloudStream Backend)"
          body: |
            ### MovieVortex 2.0 - Stable Release
            - **Pure Monochrome Theme**: OLED True Black (#000000) & Crisp White (#FFFFFF) throughout.
            - **Manrope Typography**: High-legibility Google Fonts Manrope across all UI screens.
            - **Genuine CloudStream Backend**: Embedded providers (MovieBox, AniVortex, IStreamFlare, SuperStream) pre-packaged in assets for instant launch without network lag.
            - **Trending Search Suggestions**: Clickable suggestions (Severance, Interstellar, Solo Leveling, Dune: Part Two, The Batman, Arcane, etc.).
            - **Native Hardware Playback**: ExoPlayer with adaptive HLS/DASH/MP4 stream resolution and subtitle track switching.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/stable/release/*.apk
          overwrite: true
