name: Build MovieVortex Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-flutter:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieVortex-Flutter-Monochrome-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-flutter
          name: "MovieVortex 2.0 (Flutter Ultra-Smooth Monochrome)"
          body: |
            ### MovieVortex 2.0 (Flutter Release)
            - **Design**: Pure Black & White (OLED Dark & High-Contrast White)
            - **Font**: Manrope Typography throughout
            - **Search**: Trending movie suggestions & instant auto-completion
            - **Performance**: 60/120 FPS buttery smooth transitions & animations
            - **Backend**: CloudStream Native Engine via MethodChannel
          draft: false
          prerelease: false
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
